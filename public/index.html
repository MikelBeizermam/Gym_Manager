<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מנהל חדר כושר</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <i data-lucide="dumbbell" class="logo-icon"></i>
    <span>מנהל חדר כושר</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-view="dashboard">
      <i data-lucide="layout-dashboard"></i> לוח בקרה
    </div>
    <div class="nav-item" data-view="trainers">
      <i data-lucide="briefcase"></i> מאמנים
    </div>
    <div class="nav-item" data-view="clients">
      <i data-lucide="users"></i> לקוחות
    </div>
    <div class="nav-item" data-view="schedule">
      <i data-lucide="calendar-days"></i> יומן אישי
    </div>
  </nav>
</aside>

<main class="main">
  <header class="topbar">
    <div class="topbar-right">
      <button type="button" class="hamburger" id="btn-hamburger" title="תפריט">
        <i data-lucide="menu"></i>
      </button>
      <h1 id="page-title">לוח בקרה</h1>
    </div>
    <span id="current-date" class="topbar-date"></span>
  </header>

  <div class="content">

    <!-- לוח בקרה -->
    <section id="view-dashboard" class="view active">
      <div class="stat-grid" id="stat-grid">
        <div class="loading"><div class="spinner"></div></div>
      </div>
      <div class="table-wrap">
        <div class="table-header">
          <span class="table-title">
            <i data-lucide="calendar-clock" class="title-icon"></i>
            אימונים קרובים — 7 ימים הבאים
          </span>
        </div>
        <div id="sessions-table-body">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </section>

    <!-- מאמנים -->
    <section id="view-trainers" class="view">
      <div class="section-header">
        <h2>מאמנים</h2>
      </div>
      <div class="split-layout">
        <div class="split-main">
          <div class="list-card">
            <div class="list-card-header">
              <div class="list-card-header-left">
                <span>כל המאמנים</span>
                <span class="count-badge" id="trainer-count">0</span>
              </div>
            </div>
            <div id="trainer-table-body">
              <div class="loading"><div class="spinner"></div></div>
            </div>
          </div>
        </div>
        <div class="split-aside">
          <div class="aside-card" id="trainer-aside">
            <div class="aside-card-header">
              <h3>הוספת מאמן</h3>
            </div>
            <div class="aside-card-body" id="trainer-aside-body"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- לקוחות -->
    <section id="view-clients" class="view">
      <div class="section-header">
        <h2>לקוחות</h2>
        <div class="section-header-actions">
          <div class="search-box">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="client-search" placeholder="חיפוש...">
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-client">
            <i data-lucide="plus"></i> הוסף לקוח
          </button>
        </div>
      </div>
      <div class="split-layout">
        <div class="split-main">
          <div class="list-card">
            <div class="list-card-header">
              <div class="list-card-header-left">
                <span>כל הלקוחות</span>
                <span class="count-badge" id="client-count">0</span>
              </div>
            </div>
            <div id="clients-table-body">
              <div class="loading"><div class="spinner"></div></div>
            </div>
          </div>
        </div>
        <div class="split-aside">
          <div class="aside-card" id="client-aside">
            <div class="aside-card-header">
              <h3 id="client-aside-title">פרטי לקוח</h3>
              <button type="button" class="close-btn client-aside-close-btn" id="client-aside-close" title="סגור">
                <i data-lucide="x"></i>
              </button>
            </div>
            <div class="aside-card-body" id="client-aside-body">
              <div class="aside-empty-state">
                <i data-lucide="user" class="empty-icon"></i>
                <p>בחר לקוח מהרשימה לצפייה בפרטים</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- יומן אישי -->
    <section id="view-schedule" class="view">
      <div class="schedule-controls">
        <div class="schedule-trainer-pick">
          <label class="schedule-trainer-label">אני המאמן:</label>
          <select id="schedule-trainer-select" class="schedule-trainer-select" aria-label="בחר מאמן">
            <option value="">— בחר מאמן —</option>
          </select>
        </div>
        <div class="week-nav">
          <button type="button" class="btn btn-secondary btn-sm" id="btn-prev-week">
            <i data-lucide="chevron-right"></i> שבוע קודם
          </button>
          <span class="week-label" id="week-label"></span>
          <button type="button" class="btn btn-secondary btn-sm" id="btn-next-week">
            שבוע הבא <i data-lucide="chevron-left"></i>
          </button>
          <button type="button" class="btn btn-primary btn-sm" id="btn-today">היום</button>
        </div>
      </div>
      <div id="schedule-content">
        <div class="empty-state">
          <i data-lucide="calendar-days" class="empty-icon"></i>
          <h3>בחר מאמן כדי להציג את לוח הזמנים</h3>
          <p>בחר את שמך מהרשימה למעלה</p>
        </div>
      </div>
    </section>

  </div>
</main>

<div id="modal-container"></div>
<div class="toast-container" id="toast-container"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
</body>
</html>
